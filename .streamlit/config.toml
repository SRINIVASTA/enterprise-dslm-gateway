[server]
headless = true
maxUploadSize = 25
enableCORS = false            # Controlled routing protection block
enableXsrfProtection = true   # Cross-Site Request Forgery protection active

[theme]
primaryColor = "#FF4B4B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"

[client]
showErrorDetails = false      # Prevents raw Python stack traces leaking to users
